name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: pspdev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate changelog
        run: |
          echo "We are pleased to announce the ${{ github.ref_name }} release of this PSPDEV fork." > changelog.md
          echo "" >> changelog.md
          echo "Source and installation information: https://github.com/StochasticEagle/pspdev" >> changelog.md
          echo "" >> changelog.md
          ./build-changelog.sh >> changelog.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: changelog.md
          make_latest: true
          tag_name: ${{ github.ref_name }}

  build:
    runs-on: ${{ matrix.os[0] }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - [macos-latest, arm64, bash]
          - [macos-15-intel, x86_64, bash]
          - [ubuntu-latest, x86_64, bash]
          - [ubuntu-24.04-arm, arm64, bash]

    defaults:
      run:
        shell: ${{ matrix.os[2] }} {0}

    steps:
      - uses: actions/checkout@v6

      - name: Allow CMake to be installed on macOS
        if: startsWith(matrix.os[0], 'macos')
        run: brew uninstall cmake

      - name: Install dependencies
        run: ./prepare.sh

      - name: Build PSPDEV
        run: |
          if [[ "${{ matrix.os[0] }}" == macos* ]]; then
            export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
            export PATH="$(brew --prefix libtool)/libexec/gnubin:$PATH"
            export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig:$(brew --prefix openssl)/lib/pkgconfig"
          fi
          export PSPDEV="$PWD/pspdev"
          export PATH="$PSPDEV/bin:$PATH"
          ./build-all.sh

      - name: Archive PSPDEV
        run: tar -zcvf "pspdev-${{ matrix.os[0] }}-${{ matrix.os[1] }}.tar.gz" pspdev

      - uses: actions/upload-artifact@v7
        with:
          name: pspdev-${{ matrix.os[0] }}-${{ matrix.os[1] }}
          path: pspdev-${{ matrix.os[0] }}-${{ matrix.os[1] }}.tar.gz

      - name: Attach tagged release artifact
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: pspdev-${{ matrix.os[0] }}-${{ matrix.os[1] }}.tar.gz
          tag_name: ${{ github.ref_name }}

  build-containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - [fedora, latest]
          - [debian, latest]

    container: ${{ matrix.container[0] }}:${{ matrix.container[1] }}

    steps:
      - name: Install bootstrap tools on Fedora
        if: matrix.container[0] == 'fedora'
        run: |
          dnf -y install git sudo
          useradd -m build

      - name: Install bootstrap tools on Debian
        if: matrix.container[0] == 'debian'
        run: |
          apt-get update
          apt-get install -y git sudo
          useradd -m build

      - uses: actions/checkout@v6

      - name: Install dependencies
        run: ./prepare.sh

      - name: Build PSPDEV
        run: |
          export PSPDEV="$PWD/pspdev"
          export PATH="$PSPDEV/bin:$PATH"
          chown -R build:build .
          sudo -u build env PSPDEV="$PSPDEV" PATH="$PATH" ./build-all.sh

      - name: Archive PSPDEV
        run: tar -zcvf "pspdev-${{ matrix.container[0] }}-${{ matrix.container[1] }}.tar.gz" pspdev

      - uses: actions/upload-artifact@v7
        with:
          name: pspdev-${{ matrix.container[0] }}-${{ matrix.container[1] }}
          path: pspdev-${{ matrix.container[0] }}-${{ matrix.container[1] }}.tar.gz

      - name: Attach tagged release artifact
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: pspdev-${{ matrix.container[0] }}-${{ matrix.container[1] }}.tar.gz
          tag_name: ${{ github.ref_name }}

  legacy-prx-status:
    if: always()
    needs:
      - build
      - build-containers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check legacy PRX inventory
        id: legacy-prx
        run: |
          git submodule update --init --depth 1 components/pspsdk
          missing=()
          for prx in intraFont-vlf.prx lflash_fdisk.prx libpsardumper.prx pspdecrypt.prx vlf.prx; do
            if [[ ! -f "components/pspsdk/src/pre-built/$prx" ]]; then
              missing+=("$prx")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf '%s\n' "${missing[@]}" > legacy-prx-status.txt
            echo "missing=true" >> "$GITHUB_OUTPUT"
            {
              echo 'names<<EOF'
              printf '%s\n' "${missing[@]}"
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report neutral legacy PRX status
        if: steps.legacy-prx.outputs.missing == 'true'
        uses: actions/github-script@v8
        env:
          MISSING_LEGACY_PRXS: ${{ steps.legacy-prx.outputs.names }}
        with:
          script: |
            const missing = process.env.MISSING_LEGACY_PRXS.trim().split(/\r?\n/).filter(Boolean);
            core.warning(`Legacy pre-built PRXs unavailable: ${missing.join(', ')}`);
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Legacy PRX status',
                head_sha: context.sha,
                status: 'completed',
                conclusion: 'neutral',
                output: {
                  title: 'Legacy PRX set is incomplete',
                  summary: `Temporary soft-fail: missing ${missing.join(', ')}. Source-built modules remain strict.`
                }
              });
            } catch (error) {
              core.warning(`Unable to publish neutral Legacy PRX check: ${error.message}`);
            }

