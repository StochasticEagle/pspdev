name: GCC 16.2 development validation

on:
  push:
    branches:
      - gcc-16.2

permissions:
  contents: read

concurrency:
  group: gcc16-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build-and-sdk:
    # This workflow exists only on gcc-16.2. It does not install release
    # artifacts or alter the regular/default-branch PSPDEV workflow.
    if: github.ref == 'refs/heads/gcc-16.2'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PSPDEV: ${{ github.workspace }}/_gcc16-pspdev
    steps:
      - name: Check out the GCC 16.2 development dependency chain
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Confirm pinned GCC 16.2 and branch dependency chain
        shell: bash
        run: |
          set -euo pipefail
          toolchain=components/psp-toolchain
          allegrex="$toolchain/components/psp-toolchain-allegrex"
          gcc="$allegrex/components/gcc"
          test "$(cat "$gcc/gcc/BASE-VER")" = "16.2.0"
          test "$(git -C "$gcc" rev-parse HEAD)" = "$(git -C "$allegrex" rev-parse HEAD:components/gcc)"
          test "$(git -C "$allegrex" rev-parse HEAD)" = "$(git -C "$toolchain" rev-parse HEAD:components/psp-toolchain-allegrex)"
          test "$(git -C "$toolchain" rev-parse HEAD)" = "$(git rev-parse HEAD:components/psp-toolchain)"
          printf 'Building GCC 16.2 source at %s\n' "$(git -C "$gcc" rev-parse HEAD)"
          df -h .

      - name: Validate test and build harness syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile psptest/audit.py psptest/verify-results.py
          bash -n psptest/build-suite.sh tests/gcc16/run.sh

      - name: Install source build dependencies
        run: |
          ./prepare.sh
          sudo apt-get install -y --no-install-recommends \
            gawk libtool-bin libarchive-tools autopoint fakeroot

      - name: Build pinned binutils, GCC 16.2, newlib, pthread and libstdc++
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PSPDEV"
          echo "$PSPDEV/bin" >> "$GITHUB_PATH"
          export PATH="$PSPDEV/bin:$PATH"
          components/psp-toolchain/components/psp-toolchain-allegrex/toolchain.sh
          test "$(psp-gcc -dumpmachine)" = "psp"
          test "$(psp-gcc -dumpfullversion)" = "16.2.0"
          df -h .

      - name: Build pinned PSPSDK from source
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PSPDEV/bin:$PATH"
          (
            cd components/pspsdk
            ./build-and-install.sh
          )
          test -f "$PSPDEV/psp/sdk/lib/libpspsdk.a"
          test -f "$PSPDEV/psp/sdk/lib/build.mak"
          df -h .

      - name: Run GCC 16.2 compiler and SDK regression tests
        shell: bash
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          bash tests/gcc16/run.sh

      - name: Build expanded PSPSDK PSPTEST bundle and audit SDK API coverage
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PSPDEV/bin:$PATH"
          PSPTEST_NAMESPACES=pspsdk PSPTEST_REQUIRE_GCC16=1 ./psptest/build-suite.sh
          test -s build/psptest/coverage.json
          test -s build/psptest.tar.gz

      - name: Record build diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p gcc16-diagnostics
          (psp-gcc -v > gcc16-diagnostics/gcc-version.txt 2>&1) || true
          (df -h > gcc16-diagnostics/disk.txt 2>&1) || true
          (du -sh components/psp-toolchain/components/psp-toolchain-allegrex/build "$PSPDEV" > gcc16-diagnostics/build-sizes.txt 2>&1) || true
          if test -f build/psptest/coverage.json; then
            cp build/psptest/coverage.json gcc16-diagnostics/psptest-coverage.json
          fi
          if test -f build/PSP/GAME/psptest/manifest.tsv; then
            cp build/PSP/GAME/psptest/manifest.tsv gcc16-diagnostics/psptest-manifest.tsv
          fi
          if test -d build/psptest/modules/pspsdk; then
            find build/psptest/modules/pspsdk -name build.log -type f -exec sh -c 'for f; do p="${f#build/psptest/modules/pspsdk/}"; mkdir -p "gcc16-diagnostics/modules/$(dirname "$p")"; cp "$f" "gcc16-diagnostics/modules/$p"; done' sh {} +
          fi

      - name: Upload GCC 16.2 diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gcc16-development-diagnostics
          path: gcc16-diagnostics/
          if-no-files-found: warn
