name: GCC 16.2 PSPTEST validation

on:
  push:
    branches: [gcc-16.2]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gcc16-psptest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/gcc-16.2'
    runs-on: ubuntu-latest
    env:
      PSPDEV: /opt/pspdev
      GH_TOKEN: ${{ secrets.PSP_CI_ARTIFACT_TOKEN || github.token }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize pinned sources
        run: |
          git -c remote.origin.tagOpt=--no-tags submodule update --init --depth 1 components/pspsdk
          git -c remote.origin.tagOpt=--no-tags submodule update --init --depth 1 components/psp-packages
          git submodule status components/pspsdk components/psp-packages

      - name: Install host dependencies
        run: |
          ./prepare.sh
          sudo apt-get install -y --no-install-recommends autopoint libarchive-tools libtool-bin

      - name: Validate PSPTEST host tools
        run: |
          set -euo pipefail
          python3 -m py_compile psptest/audit.py psptest/verify-results.py
          bash -n psptest/build-suite.sh tests/gcc16/run.sh

      - name: Resolve successful pinned GCC 16.2 toolchain build
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD:components/psp-toolchain)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          runs="$(gh api 'repos/StochasticEagle/psp-toolchain/actions/workflows/gcc16-artifact.yml/runs?branch=gcc-16.2&status=success&per_page=100')"
          run_id="$(jq -r --arg sha "$sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")][0].id // empty' <<< "$runs")"
          [[ -n "$run_id" ]] || { echo "::error::GCC 16.2 toolchain artifact missing for commit $sha"; exit 1; }
          gh api "repos/StochasticEagle/psp-toolchain/actions/runs/$run_id/artifacts?per_page=100" |
            jq -e '.artifacts[] | select(.name == "gcc16-toolchain-ubuntu-x86_64" and .expired == false)' >/dev/null
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Download pinned GCC 16.2 compiler (only version-specific dependency)
        uses: actions/download-artifact@v4
        with:
          repository: StochasticEagle/psp-toolchain
          run-id: ${{ steps.toolchain.outputs.run_id }}
          name: gcc16-toolchain-ubuntu-x86_64
          github-token: ${{ secrets.PSP_CI_ARTIFACT_TOKEN || github.token }}
          path: upstream

      - name: Install pinned GCC 16.2 toolchain
        run: |
          set -euo pipefail
          sudo tar -xzf upstream/gcc16-toolchain.tar.gz -C /opt
          sudo chown -R "$(id -u):$(id -g)" "$PSPDEV"
          echo "$PSPDEV/bin" >> "$GITHUB_PATH"
          export PATH="$PSPDEV/bin:$PATH"
          test "$(psp-gcc -dumpmachine)" = psp
          test "$(psp-gcc -dumpfullversion)" = 16.2.0
          grep -Fxq "toolchain_commit=$(git rev-parse HEAD:components/psp-toolchain)" "$PSPDEV/share/psp-ci/toolchain-source.txt"

      - name: Build pinned PSPSDK
        run: |
          mkdir -p ci-logs
          set -o pipefail
          components/pspsdk/build-and-install.sh 2>&1 | tee ci-logs/pspsdk-build.log

      - name: GCC 16.2 compiler and SDK regression probes
        run: |
          set -euo pipefail
          export PATH="$PSPDEV/bin:$PATH"
          bash tests/gcc16/run.sh 2>&1 | tee ci-logs/gcc16-probes.log


      - name: Build and install OSLib dependency closure
        run: |
          mkdir -p ci-logs
          set -o pipefail
          (
            cd components/psp-packages
            ./build.sh --install oslib
          ) 2>&1 | tee ci-logs/oslib-build.log

      - name: Build PSPTEST bundle
        run: |
          mkdir -p ci-logs
          set -o pipefail
          PSPTEST_REQUIRE_GCC16=1 ./psptest/build-suite.sh 2>&1 | tee ci-logs/psptest-build.log
          test -s build/psptest/coverage.json
          test -s build/psptest.tar.gz

      - name: Upload PSPTEST diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gcc16-psptest-diagnostics
          if-no-files-found: warn
          path: |
            ci-logs/
            components/psp-packages/build/_logs/*.log
            build/psptest/
            build/PSP/GAME/psptest/
